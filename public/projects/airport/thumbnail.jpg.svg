<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030b16;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a192a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g fill="none" stroke="rgba(148,184,215,0.06)" stroke-width="1">
    <rect x="0" y="0" width="1200" height="675" fill="url(#grid)"/>
  </g>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(148,184,215,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Central orb -->
  <circle cx="600" cy="337" r="180" fill="rgba(34,211,238,0.06)" filter="url(#blur)"/>
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <!-- Core circle -->
  <circle cx="600" cy="337" r="80" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <circle cx="600" cy="337" r="50" fill="rgba(7,25,42,0.9)" stroke="url(#accent)" stroke-width="1"/>

  <!-- Text -->
  <text x="600" y="320" text-anchor="middle" font-family="Inter, sans-serif" font-size="48" font-weight="900" fill="white" letter-spacing="-2">Imam Khomeini AIRPORT</text>
  <!-- Corner accents -->
  <g stroke="url(#accent)" stroke-width="1" fill="none">
    <path d="M 60 60 h 80 M 60 60 v 80"/>
    <path d="M 1140 60 h -80 M 1140 60 v 80" transform="rotate(0 1140 60)"/>
    <path d="M 60 615 h 80 M 60 615 v -80"/>
    <path d="M 1140 615 h -80 M 1140 615 v -80"/>
  </g>

  <!-- Floating nodes -->
  <g fill="url(#accent)">
    <circle cx="200" cy="150" r="6"/>
    <circle cx="1000" cy="180" r="5"/>
    <circle cx="180" cy="520" r="5"/>
    <circle cx="1020" cy="500" r="6"/>
    <circle cx="350" cy="100" r="4"/>
    <circle cx="850" cy="580" r="4"/>
  </g>

  <!-- Connection lines -->
  <g stroke="rgba(56,189,248,0.15)" stroke-width="1" fill="none">
    <path d="M 200 150 Q 400 200 600 337"/>
    <path d="M 1000 180 Q 800 250 600 337"/>
    <path d="M 180 520 Q 350 450 600 337"/>
    <path d="M 1020 500 Q 850 420 600 337"/>
  </g>
</svg>